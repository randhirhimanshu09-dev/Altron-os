<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Cyber Orbit Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />

  <!-- Earth Globe Grid Lines -->
  <circle cx="256" cy="256" r="110" fill="#031525" stroke="url(#neon)" stroke-width="4" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="110" ry="45" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />
  <ellipse cx="256" cy="256" rx="45" ry="110" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />
  <line x1="146" y1="256" x2="366" y2="256" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />
  <line x1="256" y1="146" x2="256" y2="366" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />

  <!-- ALTRON Stylized "A" Core Crest -->
  <path d="M256 160 L320 310 L285 310 L270 270 L242 270 L227 310 L192 310 Z M256 220 L248 245 L264 245 Z" fill="url(#gold)" filter="url(#glow)" />

  <!-- Central Sentinel Pulsing Core -->
  <circle cx="256" cy="256" r="14" fill="#38bdf8" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- OS Wordmark -->
  <text x="256" y="420" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace, sans-serif" font-weight="900" font-size="34" fill="#22d3ee" text-anchor="middle" letter-spacing="8">ALTRON OS</text>
  <text x="256" y="445" font-family="monospace" font-weight="600" font-size="14" fill="#67e8f9" text-anchor="middle" letter-spacing="4">MOBILE AI</text>
</svg>
